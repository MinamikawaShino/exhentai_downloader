[project]
name = "exhentai-downloader"
version = "1.0.0"  # Keep in sync with version_info.py VERSION
description = "ExHentai Gallery Archive Downloader"
requires-python = ">=3.9"
dependencies = [
    "selenium>=4.15.0",
    "requests>=2.31.0",
    "customtkinter>=5.2.0",
    "webdriver-manager>=4.0.0",
    "plyer>=2.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
exhentai-downloader = "src.main:main"

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
